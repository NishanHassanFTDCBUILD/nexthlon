# Render Blueprint: one click deploy of Nexthlon from this GitHub repo (https://render.com > New > Blueprint).
# Secrets are NOT stored here: each "sync: false" value is typed into Render's dashboard once.
services:
  - type: web
    name: nexthlon
    runtime: docker
    plan: free               # demo: sleeps after 15 min idle (first visit ~50s, jobs/emails pause). Use "starter" for a real shop.
    region: singapore        # closest Render region to India
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: LOG_FORMAT
        value: json
      # Scaling out (docs/SCALING.md): one copy of the app per CPU core of the instance.
      - key: WEB_CONCURRENCY
        value: auto
      # 10 connections per copy keeps several instances under the Atlas free tier's 500.
      - key: MONGODB_MAX_POOL
        value: "10"
      # Optional: a Redis address once you run more than one instance (docs/SCALING.md, step 2).
      - key: REDIS_URL
        sync: false
      - key: STORAGE_DRIVER
        value: cloudinary
      - key: MAIL_DRIVER
        value: brevo
      - key: ADMIN_REQUIRE_2FA
        value: "false"       # set to true after each admin has turned on two-step login
      - key: SITE_URL
        sync: false          # https://your-domain (or the https://nexthlon.onrender.com address Render gives you)
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PATH
        sync: false
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false          # Nexthlon <orders@your-domain>
      # The business details India's e-commerce rules ask for (footer, policy pages, invoices).
      - key: STORE_LEGAL_NAME
        sync: false
      - key: STORE_ADDRESS
        sync: false          # Building, street, City, State PIN, India
      - key: STORE_GSTIN
        sync: false
      - key: STORE_SUPPORT_EMAIL
        sync: false
      - key: STORE_SUPPORT_PHONE
        sync: false
      - key: STORE_GRIEVANCE_OFFICER
        sync: false
